<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LeetCode Contest Reporter</title>
<link rel="icon" href="/static/logo.svg">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header>
  <img src="/static/logo.svg" alt="" width="26" height="26">
  <h1>Contest Reporter</h1>
  <span id="mode" class="pill">…</span>
</header>

<!-- What must be true before a scan can run. Stays up until it is. -->
<section id="setup" class="setup"></section>

<section class="controls">
  <input id="slug" placeholder="515" title="Contest number, or a full slug" autocomplete="off">
  <button id="scan" class="primary">Start scanning</button>
  <button id="stop" class="danger" disabled>Stop</button>
  <span id="blocked" class="dim"></span>
</section>

<!-- How far along a scan is, and how far it intends to go. -->
<section id="progress" class="progress"></section>

<section class="stats" id="stats"></section>

<main class="split">
  <section class="results">
    <nav class="tabs">
      <button class="tab active" data-tab="users">Caught</button>
      <button class="tab" data-tab="scans">Contests scanned</button>
    </nav>
    <div id="users" class="panel active"></div>
    <div id="scans" class="panel"></div>
  </section>

  <section class="logcard">
    <div class="logcard-head">
      <span>Live log</span>
      <button id="clearlog" class="ghost">Clear</button>
    </div>
    <pre id="logbody"></pre>
  </section>
</main>

<script src="/static/app.js"></script>
</body>
</html>
