# LeetCode Contest Auto-Reporter configuration.

[safety]
# Master switch. When true the full pipeline runs and reports are composed and
# stored, but nothing is ever submitted to LeetCode. Ship default is true.
dry_run = true
# Refuse to file more than this many reports in a single contest scan.
max_reports_per_contest = 10
# Minimum seconds between two report submissions.
min_seconds_between_reports = 45

[scope]
# Leaderboard rank range to scan (inclusive, 1-based).
rank_start = 1
rank_end = 8
# Which contest problems to inspect. Empty list means all of them.
questions = []
# Seconds to wait between ranking/replay requests.
request_delay = 1.0

[detect]
# Score at or above which a submission is reported without asking the model.
cheat_threshold = 0.95
# Score at or above which a submission is recorded as suspicious and shown in
# the UI, but never automatically reported.
grey_low = 0.55
# --- code growth, the primary signal ---
# Fraction of the finished solution that may appear in a single step of the
# replay timeline. Honest contestants sampled on weekly-contest-515 peaked at
# 0.21; a pasted solution scores about 1.0.
burst_fraction = 0.60
# How many separate points in the timeline the code must grow at to count as
# having been written progressively.
min_growth_steps = 2
# Growth other than the single biggest jump, as a fraction of the peak, needed
# before a submission counts as genuinely authored. Without this, a handful of
# trivial edits masks a burst.
authored_fraction = 0.30
# Treat any external paste as reportable, regardless of size or what follows.
# This also reports people who paste their own template.
report_any_paste = true
# Ignore trivially short solutions, where one step is meaningless.
min_solution_chars = 200
# Points sampled along the replay timeline.
progression_samples = 12

# A single external paste of at least this many characters is decisive on its own.
# LeetCode buckets large pastes as "size > 500 chars", so 500 is its coarsest step.
large_paste_chars = 500
# Typed characters must exceed (1 - paste_ratio) x pasted characters to count as
# real authoring rather than incidental edits around a paste.
paste_ratio = 0.95
# Seconds between the last external paste and submission for
# PASTE_THEN_IMMEDIATE_SUBMIT.
instant_submit_seconds = 20
# Seconds of no editor activity immediately before a large paste that make it a
# burst rather than ongoing work. Inactivity then a sudden paste is the pattern.
idle_burst_seconds = 20
# Open the Code Replay for every submission in scope. Slower (one modal each),
# but it is the only way to see the event history. When false, only submissions
# that already look fast are opened.
inspect_all_replays = true



[browser]
# "attach" - connect to a Chrome you started with start_chrome.bat. Playwright
#            never launches it, so it is an ordinary browser and LeetCode's
#            sign-in verification treats it as one. Sign in there by hand.
# "launch" - let Playwright start its own Chrome. Simpler, but it advertises
#            itself as automated and sign-in verification tends to refuse it.
mode = "attach"
cdp_url = "http://127.0.0.1:9222"
# Profile directory, used by start_chrome.bat and by launch mode. Kept separate
# from your everyday Chrome profile.
user_data_dir = "data/chrome-profile"
headless = false


[paths]
database = "data/reporter.db"
